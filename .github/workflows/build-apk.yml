name: Build Real APK v3 (Fixed Gradle 8)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter 3.32.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'
          cache: true
      - name: Fix old android folder (Gradle 8 fix)
        run: |
          echo "Checking android folder..."
          if [ -d "android" ]; then
            if grep -r "com.android.tools.build:gradle:[0-7]\." android/ 2>/dev/null || grep -q "gradle-7" android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null; then
              echo "Old Gradle detected - regenerating"
              rm -rf android
              flutter create --platforms=android . --org com.mahani --project-name mahani_app
            fi
          else
            flutter create --platforms=android . --org com.mahani --project-name mahani_app
          fi
      - name: Install deps
        run: |
          flutter clean
          flutter pub get
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload real APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
