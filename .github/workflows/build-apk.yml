name: Build APK Real
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.32.5'}
      - run: |
          if [ -d "android" ] && grep -q "gradle-7" android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null; then rm -rf android; fi
          [ ! -d "android" ] && flutter create --platforms=android .
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: {name: apk, path: build/app/outputs/flutter-apk/app-release.apk}
