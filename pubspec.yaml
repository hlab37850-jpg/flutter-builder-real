name: mahani_app
description: المواصفات الكاملة للتطبيق

أريد تطوير تطبيق أندرويد احترافي ومتطور مخصص لإدارة العملاء، والأرصدة، والأصناف، والمخزون، ومواعيد الاستحقاق، والتنبيهات الذكية، مع الاعتماد على الاستيراد المباشر من قواعد بيانات برامج المحاسبة أو ملفات الاستيراد، دون أن يكون التطبيق نظام مبيعات أو مشتريات. الهدف الأساسي هو متابعة العملاء والمخزون وتحديث البيانات بسهولة، مع الحفاظ على دقة المعلومات وسرعة الأداء.

يحتوي التطبيق على إدارة متكاملة للعملاء تشمل حفظ اسم العميل، ورقم الهاتف، والعنوان، والملاحظات، والعملة، والرصيد الحالي، وحالة العميل. يعتمد التطبيق دائماً على الرصيد الحالي فقط، فعند استيراد بيانات جديدة يتم استبدال الرصيد السابق بالرصيد الحالي الموجود في المصدر دون تسجيل دفعات أو إنشاء قيود محاسبية أو عمليات بيع وشراء. كما يجب التمييز بين العملاء الذين عليهم مبالغ والعملاء الذين لهم مبالغ، مع الحفاظ على القيم كما هي دون تصفير أو تغيير للإشارة.

يدعم التطبيق إدارة الأصناف والمخزون، بحيث يتم حفظ اسم الصنف كاملاً دون حذف أي حرف أو رقم أو رمز، مع التصنيف، والوحدة، والكمية الحالية، والحد الأدنى للمخزون، وحد إعادة الطلب، والملاحظات. ويعرض تنبيهات عند انخفاض المخزون أو نفاده، مع لوحة تعرض الأصناف الناقصة والمنتهية.

يوفر التطبيق نظام مواعيد استحقاق متقدم، بحيث يمكن تحديد التاريخ والوقت لكل عميل، ويرسل تنبيهات قبل الموعد بيوم، وفي يوم الاستحقاق، وبعده وفق إعدادات المستخدم. وإذا انتهى موعد الاستحقاق ولم يتم تحديث الرصيد، ينتقل العميل تلقائياً إلى قائمة العملاء المنسيين حتى تتم متابعته. كما تحتوي رسائل التذكير على بيانات المحل (الاسم، الشعار، العنوان، وأرقام التواصل) التي يتم حفظها في إعدادات التطبيق.

تحتوي الإعدادات على بيانات المحل، وتشمل اسم المحل، والشعار، والعنوان، وأرقام التواصل، ورسائل التذكير الافتراضية، وأوقات التنبيهات، وإعدادات النسخ الاحتياطي، وإعدادات الاستيراد، بحيث تستخدم هذه البيانات تلقائياً في الرسائل والتقارير.

يعتمد التطبيق على محرك استيراد ذكي (Smart Import Engine) يدعم عدة مصادر للاستيراد بالترتيب: قاعدة بيانات برنامج المحاسب أو النسخة الاحتياطية، ثم ملفات Excel، ثم CSV، ثم PDF كخيار احتياطي. عند توفر قاعدة بيانات برنامج المحاسب أو ملف DB، يقوم التطبيق بقراءة الجداول وتحليلها واستخراج العملاء والأصناف والمخزون فقط، مع تجاهل المبيعات، والمشتريات، والفواتير، وسندات القبض والصرف، والقيود المحاسبية، وأي بيانات تشغيلية أخرى.

إذا تم الاستيراد من PDF، يقوم التطبيق بقراءة الملف كاملاً، وإزالة بيانات رأس الصفحة (Header) وتذييل الصفحة (Footer)، واسم المحل، والعنوان، وأرقام الهواتف، ورؤوس الجداول، وصفوف الإجماليات، ثم يحول الجداول إلى نموذج بيانات منظم لتحليلها بدقة. يجب أن يعتمد الاستيراد على مبدأ عدم فقدان البيانات (Lossless Import)، بحيث لا يتم حذف أي حرف أو رقم أو رمز أو مقاس أو وحدة من أسماء العملاء أو الأصناف، مع الحفاظ على النصوص الأصلية كما هي. كما يجب أن يتعرف التطبيق تلقائياً على أعمدة (له، عليه، مدين، دائن، الرصيد، المتبقي)، وأن يحافظ على الأرصدة كما هي دون تصفير أو تغيير للإشارة، مع منع استيراد صفوف الإجماليات أو بيانات المحل كسجلات، ومنع إنشاء عملاء أو أصناف مكررة.

قبل تنفيذ أي عملية استيراد، يعرض التطبيق شاشة مراجعة توضح عدد العملاء والأصناف التي سيتم إضافتها أو تحديثها، وعدد السجلات المكررة أو التي تحتاج إلى مراجعة، مع إمكانية تعديل أي قيمة يدوياً. كما ينشئ نسخة احتياطية تلقائية قبل الاستيراد، ويتيح التراجع عن آخر عملية استيراد، ويعرض تقريراً مفصلاً بعد الانتهاء.

يتعلم التطبيق من كل عملية استيراد، ويحفظ طريقة تحليل الملفات القادمة من نفس البرنامج المحاسبي، كما يحفظ التصحيحات التي يجريها المستخدم، ويستخدمها لتحسين دقة الاستيراد مستقبلاً.

يوفر التطبيق لوحة تحكم احترافية تعرض عدد العملاء، وإجمالي الأرصدة، والعملاء المستحقين اليوم، والعملاء المتأخرين، والعملاء المنسيين، وعدد الأصناف، والأصناف الناقصة، وآخر عمليات الاستيراد، وآخر التنبيهات، مع إمكانية البحث والتصفية حسب الاسم، أو الهاتف، أو الرصيد، أو الصنف، أو التصنيف، أو التاريخ، أو حالة العميل.

يسجل التطبيق جميع عمليات الإضافة، والتعديل، والاستيراد، مع سجل يوضح تغير رصيد العميل بين كل تحديث وآخر دون اعتباره عملية سداد. كما يوفر نسخاً احتياطية تلقائية، واستعادة للبيانات، وقفل التطبيق بكلمة مرور أو بصمة إذا كان الجهاز يدعم ذلك.

إضافة الذكاء الاصطناعي:

يجب أن يحتوي التطبيق على مساعد ذكاء اصطناعي مدمج، وليس مجرد روبوت محادثة، بل نظام يساعد في جميع أجزاء التطبيق. يقوم الذكاء الاصطناعي بتحليل ملفات الاستيراد قبل تنفيذها، واكتشاف الأخطاء، واقتراح أفضل طريقة للاستيراد، والتعرف على نوع الملف ومصدره، والتأكد من عدم حذف أي بيانات أو أحرف أو أرقام أو رموز، واكتشاف العملاء أو الأصناف المكررة، ومنع استيراد بيانات المحل أو صفوف الإجماليات، واكتشاف أي رصيد تم تفسيره بشكل خاطئ.

كما يستطيع المستخدم التحدث مع المساعد باللغة العربية وطلب أوامر مثل: عرض العملاء المتأخرين، أو العملاء الذين لهم أرصدة، أو الأصناف الناقصة، أو إنشاء تقرير، أو البحث عن عميل أو صنف، أو تحليل ملف قبل استيراده. وينفذ المساعد هذه المهام مباشرة داخل التطبيق.

يقوم الذكاء الاصطناعي أيضاً بتحليل العملاء واقتراح أولويات المتابعة، وتحليل المخزون والتنبيه إلى الأصناف التي أوشكت على النفاد، وإنشاء رسائل تذكير احترافية، وإنشاء تقارير PDF وExcel، والتعلم من استخدام المستخدم لتحسين الأداء مع مرور الوقت. ويجب أن يحافظ على خصوصية البيانات، وألا يرسل أي بيانات خارج الجهاز إلا إذا وافق المستخدم صراحة على ذلك.

الهدف النهائي هو إنشاء تطبيق احترافي، سريع، ومستقر، يعتمد على أحدث الممارسات في إدارة البيانات، ويجمع بين سهولة الاستخدام، والاستيراد الذكي، وإدارة العملاء والمخزون، والتنبيهات، والذكاء الاصطناعي، ليكون أداة عملية وموثوقة لإدارة المحل مع إمكانية تطويره وإضافة مزايا جديدة مستقبلاً دون الحاجة إلى إعادة بناء النظام - تم إنشاؤه بواسطة Mahani Builder AI v3
